<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>消防查验图片资料</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Microsoft YaHei",Arial,sans-serif;background:#f4f6f8;color:#1f2937}
header{background:#1677ff;color:#fff;padding:18px 22px;font-size:20px;font-weight:700}
main{max-width:1000px;margin:22px auto;padding:0 16px}
.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:18px;box-shadow:0 3px 14px #00000012}
h2{margin:0 0 16px;font-size:20px}h3{margin:0 0 12px;font-size:17px}
label{display:block;font-weight:600;margin:14px 0 7px}input,textarea{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:9px;font-size:15px}
textarea{min-height:80px;resize:vertical}
button{border:0;border-radius:9px;padding:12px 18px;font-size:15px;font-weight:600;cursor:pointer}
.primary{background:#1677ff;color:#fff}.secondary{background:#eef4ff;color:#1667d9}.danger{background:#fff0f0;color:#d22}.success{background:#16a34a;color:#fff}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.photo-box{border:2px dashed #cbd5e1;border-radius:12px;padding:14px;text-align:center;min-height:220px}
.photo-box img{max-width:100%;max-height:260px;border-radius:8px;margin-top:10px}
.photo-box input{border:0;padding:8px}
.status{font-size:13px;margin-top:7px}.ok{color:#16803a}.warn{color:#b45309}
.badge{display:inline-block;background:#eef4ff;color:#1667d9;padding:4px 9px;border-radius:999px;font-size:12px}
.hidden{display:none!important}
.preview-page{background:#fff;max-width:900px;margin:20px auto;padding:45px;box-shadow:0 2px 15px #0002}

ent:flex-start;align-items:center;gap:15mm;padding-top:2.5mm}.word-table{break-inside:avoid;width:19cm;height:138.5mm;margin:0;flex:0 0 138.5mm}.photo-cell{height:98.5mm!important;max-height:98.5mm!important}.photo-cell img{max-height:96mm!important}}</style>

<body>
<header>消防查验图片资料 · Windows 测试版</header>
<main>
<section id="editor">
<div class="card">
<h2>① 项目基本信息</h2>
<label>项目名称</label><input id="projectName" placeholder="例如：XXX 项目">
<label>日期</label><input id="projectDate" type="date">
</div>

<div id="items"></div>

<div class="card no-print">
<div class="actions">
<button class="secondary" onclick="addItem()">＋ 新增查验子项</button>
<button class="success" onclick="finishProject()">生成 Word / PDF</button>
</div>
<p class="small">每个查验子项需要 2 张照片：第1张为“现场拍摄影像”，第2张为“现场拍摄数据”。每页固定放 2 个表格；两表格间距 1.5 cm。</p>
</div>
</section>

<section id="preview" class="hidden">
<div class="card no-print">
<h2>生成 Word / PDF</h2>
<p>文档按 A4 页面生成：封面 1 页，后续每页固定放 2 个查验表格；两表格间距 1.5 cm；单表格时固定使用第1个表格的位置。照片只在固定单元格内等比例缩放。</p>
<div class="actions">
<button class="secondary" onclick="backToEdit()">← 返回修改</button>
<button class="primary" onclick="generateDocx()">生成 Word（DOCX）</button>
<button class="primary" onclick="generatePdf()">生成 PDF</button>
</div>
</div>
<div id="previewContent"></div>
</section>
</main>

<script>
let items=[];
let nextId=1;
const $=id=>document.getElementById(id);

function init(){
  const d=new Date(); const iso=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
  $("projectDate").value=iso; addItem();
}
function addItem(){
  items.push({id:nextId++,subItem:"",location:"",note:"",image:null,data:null});
  renderItems();
  setTimeout(()=>document.getElementById("item-"+items[items.length-1].id)?.scrollIntoView({behavior:"smooth",block:"start"}),50);
}
function renderItems(){
  $("items").innerHTML=items.map((it,i)=>`
  <div class="card" id="item-${it.id}">
    <h2>查验子项 ${i+1} <span class="badge">${complete(it)?"已完成":"填写中"}</span></h2>
    <label>查验子项</label>
    <input value="${esc(it.subItem)}" placeholder="请输入查验子项" oninput="items[${i}].subItem=this.value;renderBadgesOnly()">
    <label>拍摄位置</label>
    <input value="${esc(it.location)}" placeholder="请输入拍摄位置" oninput="items[${i}].location=this.value">
    <label>拍摄说明</label>
    <textarea placeholder="请输入拍摄说明" oninput="items[${i}].note=this.value">${esc(it.note)}</textarea>
    <div class="photo-grid">
      ${photoBox(i,"image","现场拍摄影像",it.image)}
      ${photoBox(i,"data","现场拍摄数据",it.data)}
    </div>
    <div class="actions">
      ${items.length>1?`<button class="danger" onclick="removeItem(${i})">删除本项</button>`:""}
    </div>
  </div>`).join("");
}
function renderBadgesOnly(){ /* 保留输入焦点，不重绘 */ }
function photoBox(i,key,title,data){
  return `<div class="photo-box">
    <h3>${title}</h3>
    <input type="file" accept="image/*" capture="environment" onchange="loadPhoto(event,${i},'${key}')">
    ${data?`<img src="${data}"><div class="status ok">✓ 已添加照片</div>`:`<div class="status warn">请添加照片</div>`}
  </div>`;
}
function loadPhoto(e,i,key){
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();r.onload=()=>{items[i][key]=r.result;renderItems();};r.readAsDataURL(f);
}
function removeItem(i){if(confirm("确定删除这个查验子项？")){items.splice(i,1);renderItems();}}
function complete(it){return it.subItem.trim()&&it.location.trim()&&it.image&&it.data}
function finishProject(){
  const name=$("projectName").value.trim();
  if(!name){alert("请先填写项目名称");$("projectName").focus();return}
  const bad=items.findIndex(x=>!complete(x));
  if(bad>=0){alert("请完成第 "+(bad+1)+" 个查验子项：查验子项、拍摄位置以及2张照片都需要填写。");return}
  buildPreview();$("editor").classList.add("hidden");$("preview").classList.remove("hidden");window.scrollTo(0,0);
}
function formatDate(date){
  if(!date) return "";
  const p=date.split("-");
  return p.length===3 ? `${p[0]} 年 ${p[1]} 月 ${p[2]} 日` : date;
}

function dataUrlToUint8Array(dataUrl){
  const base64=(dataUrl.split(',')[1]||'').replace(/\s/g,''); const bin=atob(base64); const arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i); return arr;
}
function cmToTwips(cm){return Math.round(cm/2.54*1440)}
function mmToEmu(mm){return Math.round(mm/25.4*914400)}
function escXml(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;')}
function dataUrlMime(dataUrl){const m=(dataUrl||'').match(/^data:([^;,]+)/);return m?m[1]:'image/jpeg'}
function imageExt(dataUrl){const m=dataUrlMime(dataUrl);return m.includes('png')?'png':'jpg'}

// Minimal ZIP writer (stored entries, no external libraries required).
const CRC_TABLE=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xedb88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}return t;})();
function crc32(bytes){let c=0xffffffff;for(let i=0;i<bytes.length;i++)c=CRC_TABLE[(c^bytes[i])&255]^(c>>>8);return (c^0xffffffff)>>>0}
function u16(n){return new Uint8Array([n&255,(n>>>8)&255])}
function u32(n){return new Uint8Array([n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255])}
function concatBytes(parts){let total=0;for(const p of parts)total+=p.length;const out=new Uint8Array(total);let o=0;for(const p of parts){out.set(p,o);o+=p.length}return out}
function utf8(s){return new TextEncoder().encode(s)}
function makeZip(entries){
  const local=[], central=[]; let offset=0;
  for(const e of entries){const name=utf8(e.name), data=e.data instanceof Uint8Array?e.data:utf8(e.data);const crc=crc32(data);
    const lh=concatBytes([u32(0x04034b50),u16(20),u16(0x800),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),name,data]);local.push(lh);
    const ch=concatBytes([u32(0x02014b50),u16(20),u16(20),u16(0x800),u16(0),u16(0),u32(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset),name]);central.push(ch);offset+=lh.length;
  }
  const cd=concatBytes(central), body=concatBytes(local);const end=concatBytes([u32(0x06054b50),u16(0),u16(0),u16(entries.length),u16(entries.length),u32(cd.length),u32(body.length),u16(0)]);
  return new Blob([body,cd,end],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}

async function getImageFit(dataUrl,maxWmm,maxHmm){
  return new Promise(resolve=>{
    if(!dataUrl){resolve(null);return;}
    const im=new Image();
    im.onload=()=>{
      const iw=im.naturalWidth||im.width||1, ih=im.naturalHeight||im.height||1;
      const scale=Math.min(maxWmm/iw, maxHmm/ih);
      resolve({cx:mmToEmu(iw*scale),cy:mmToEmu(ih*scale)});
    };
    im.onerror=()=>resolve({cx:mmToEmu(maxWmm),cy:mmToEmu(maxHmm)});
    im.src=dataUrl;
  });
}
async function tableXml(it,rels){

  const a=addImg(it.image), b=addImg(it.data);

  x+=`<w:tr><w:trPr><w:trHeight w:val="${rows[0]}" w:hRule="exact"/></w:trPr>${tc('查验子项',labelW)}${tc(it.subItem,rest,'left',1,3)}</w:tr>`;
  x+=`<w:tr><w:trPr><w:trHeight w:val="${rows[1]}" w:hRule="exact"/></w:trPr>${tc('现场拍摄影像',half,'center',1,2)}${tc('现场拍摄数据',half,'center',1,2)}</w:tr>`;
  x+=`<w:tr><w:trPr><w:trHeight w:val="${rows[2]}" w:hRule="exact"/></w:trPr>${imageTc(it.image,a,da)}${imageTc(it.data,b,db)}</w:tr>`;

  const documentXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><w:body>${docBody}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="0" w:right="425" w:bottom="0" w:left="425" w:header="0" w:footer="0" w:gutter="0"/></w:sectPr></w:body></w:document>`;
  const styles=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="SimSun" w:eastAsia="宋体"/><w:lang w:val="zh-CN"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="0"/></w:pPr></w:pPrDefault></w:docDefaults></w:styles>`;
  const settings=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:settings xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:zoom w:percent="100"/></w:settings>`;
  const contentTypes=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="jpg" ContentType="image/jpeg"/><Default Extension="jpeg" ContentType="image/jpeg"/><Default Extension="png" ContentType="image/png"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/word/settings.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.settings+xml"/></Types>`;
  const rootRels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`;
  const wordRels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdStyles" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/><Relationship Id="rIdSettings" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/settings" Target="settings.xml"/>${relEntries}</Relationships>`;
  entries.push({name:'[Content_Types].xml',data:contentTypes},{name:'_rels/.rels',data:rootRels},{name:'word/document.xml',data:documentXml},{name:'word/styles.xml',data:styles},{name:'word/settings.xml',data:settings},{name:'word/_rels/document.xml.rels',data:wordRels});
  rels.forEach((r,i)=>entries.push({name:`word/media/image${i+1}.${r.ext}`,data:r.bytes}));
  const blob=makeZip(entries); const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${name}_图片数据.docx`;a.type='application/vnd.openxmlformats-officedocument.wordprocessingml.document';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function generatePdf(){
  const oldTitle=document.title;document.title=( $('projectName').value.trim()||'消防查验图片资料')+'_图片数据';
  alert('即将打开打印窗口。请选择“另存为 PDF”即可生成 PDF 文件。');
  window.print();
  document.title=oldTitle;
}
function backToEdit(){$("preview").classList.add("hidden");$("editor").classList.remove("hidden");window.scrollTo(0,0)}
function esc(s){return String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
