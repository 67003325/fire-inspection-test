<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>消防查验图片资料</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Microsoft YaHei",Arial,sans-serif;background:#f4f6f8;color:#1f2937}
header{background:#1677ff;color:#fff;padding:18px 22px;font-size:20px;font-weight:700}
main{max-width:1000px;margin:22px auto;padding:0 16px}
.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:18px;box-shadow:0 3px 14px #00000012}
h2{margin:0 0 16px;font-size:20px}h3{margin:0 0 12px;font-size:17px}
label{display:block;font-weight:600;margin:14px 0 7px}input,textarea{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:9px;font-size:15px}
textarea{min-height:80px;resize:vertical}
button{border:0;border-radius:9px;padding:12px 18px;font-size:15px;font-weight:600;cursor:pointer}
.primary{background:#1677ff;color:#fff}.secondary{background:#eef4ff;color:#1667d9}.danger{background:#fff0f0;color:#d22}.success{background:#16a34a;color:#fff}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.photo-box{border:2px dashed #cbd5e1;border-radius:12px;padding:14px;text-align:center;min-height:220px}
.photo-box img{max-width:100%;max-height:260px;border-radius:8px;margin-top:10px}
.photo-box input{border:0;padding:8px}
.status{font-size:13px;margin-top:7px}.ok{color:#16803a}.warn{color:#b45309}
.badge{display:inline-block;background:#eef4ff;color:#1667d9;padding:4px 9px;border-radius:999px;font-size:12px}
.hidden{display:none!important}
.preview-page{background:#fff;max-width:900px;margin:20px auto;padding:45px;box-shadow:0 2px 15px #0002}
.cover{min-height:900px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.cover{position:relative}.cover-logo{position:absolute;top:0;left:0;width:2.02cm;height:1.58cm;object-fit:contain;display:block}.cover .project{font-size:34px;font-weight:700;margin-bottom:55px}.cover .title{font-size:27px;font-weight:700;margin-bottom:100px}.cover-bottom{margin-top:auto;text-align:center;padding-top:80px}.cover .company{font-size:19px}.cover .date{margin-top:20px}
.word-table{width:100%;border-collapse:collapse;margin:20px 0 35px;table-layout:fixed}.word-table td{border:1px solid #333;padding:10px;vertical-align:middle;min-height:45px}.label{font-weight:700;background:#f8f8f8;width:16%;text-align:center}
.photo-block{padding:0!important;vertical-align:top!important}.photo-title{font-weight:700;text-align:center;padding:10px 6px;border-bottom:1px solid #333;background:#f8f8f8}.photo-cell{height:260px;text-align:center;padding:8px}.photo-cell img{max-width:100%;max-height:240px;object-fit:contain}
.small{font-size:13px;color:#6b7280}
@media(max-width:700px){.photo-grid{grid-template-columns:1fr}.preview-page{padding:20px}.cover{min-height:600px}.cover .project{font-size:27px}}
@media print{body{background:#fff}.no-print{display:none!important}.preview-page{box-shadow:none;margin:0;max-width:none}.page-break{break-before:page}.word-table{break-inside:avoid}}
</style>
</head>
<body>
<header>消防查验图片资料 · Windows 测试版</header>
<main>
<section id="editor">
<div class="card">
<h2>① 项目基本信息</h2>
<label>项目名称</label><input id="projectName" placeholder="例如：XXX 项目">
<label>日期</label><input id="projectDate" type="date">
</div>

<div id="items"></div>

<div class="card no-print">
<div class="actions">
<button class="secondary" onclick="addItem()">＋ 新增查验子项</button>
<button class="success" onclick="finishProject()">完成并生成预览</button>
</div>
<p class="small">每个查验子项需要 2 张照片：第1张为“现场拍摄影像”，第2张为“现场拍摄数据”。每页预览放 2 个表格。</p>
</div>
</section>

<section id="preview" class="hidden">
<div class="card no-print">
<h2>生成预览</h2>
<p>下面按照“封面 → 每页2个查验表格”的规则生成。浏览器可直接打印为 PDF。</p>
<div class="actions">
<button class="secondary" onclick="backToEdit()">← 返回修改</button>
<button class="primary" onclick="window.print()">打印 / 保存 PDF</button>
</div>
</div>
<div id="previewContent"></div>
</section>
</main>

<script>
let items=[];
let nextId=1;
const $=id=>document.getElementById(id);

function init(){
  const d=new Date(); const iso=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
  $("projectDate").value=iso; addItem();
}
function addItem(){
  items.push({id:nextId++,subItem:"",location:"",note:"",image:null,data:null});
  renderItems();
  setTimeout(()=>document.getElementById("item-"+items[items.length-1].id)?.scrollIntoView({behavior:"smooth",block:"start"}),50);
}
function renderItems(){
  $("items").innerHTML=items.map((it,i)=>`
  <div class="card" id="item-${it.id}">
    <h2>查验子项 ${i+1} <span class="badge">${complete(it)?"已完成":"填写中"}</span></h2>
    <label>查验子项</label>
    <input value="${esc(it.subItem)}" placeholder="请输入查验子项" oninput="items[${i}].subItem=this.value;renderBadgesOnly()">
    <label>拍摄位置</label>
    <input value="${esc(it.location)}" placeholder="请输入拍摄位置" oninput="items[${i}].location=this.value">
    <label>拍摄说明</label>
    <textarea placeholder="请输入拍摄说明" oninput="items[${i}].note=this.value">${esc(it.note)}</textarea>
    <div class="photo-grid">
      ${photoBox(i,"image","现场拍摄影像",it.image)}
      ${photoBox(i,"data","现场拍摄数据",it.data)}
    </div>
    <div class="actions">
      ${items.length>1?`<button class="danger" onclick="removeItem(${i})">删除本项</button>`:""}
    </div>
  </div>`).join("");
}
function renderBadgesOnly(){ /* 保留输入焦点，不重绘 */ }
function photoBox(i,key,title,data){
  return `<div class="photo-box">
    <h3>${title}</h3>
    <input type="file" accept="image/*" capture="environment" onchange="loadPhoto(event,${i},'${key}')">
    ${data?`<img src="${data}"><div class="status ok">✓ 已添加照片</div>`:`<div class="status warn">请添加照片</div>`}
  </div>`;
}
function loadPhoto(e,i,key){
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();r.onload=()=>{items[i][key]=r.result;renderItems();};r.readAsDataURL(f);
}
function removeItem(i){if(confirm("确定删除这个查验子项？")){items.splice(i,1);renderItems();}}
function complete(it){return it.subItem.trim()&&it.location.trim()&&it.image&&it.data}
function finishProject(){
  const name=$("projectName").value.trim();
  if(!name){alert("请先填写项目名称");$("projectName").focus();return}
  const bad=items.findIndex(x=>!complete(x));
  if(bad>=0){alert("请完成第 "+(bad+1)+" 个查验子项：查验子项、拍摄位置以及2张照片都需要填写。");return}
  buildPreview();$("editor").classList.add("hidden");$("preview").classList.remove("hidden");window.scrollTo(0,0);
}
function formatDate(date){
  if(!date) return "";
  const p=date.split("-");
  return p.length===3 ? `${p[0]} 年 ${p[1]} 月 ${p[2]} 日` : date;
}
